<text x="1245.0" y="1002.0" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Возврат силы 0,4–1</tspan></text>
<text x="900" y="1080" font-family="Times New Roman" font-size="46" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Начальный слышимый отсчёт задаёт фон без формирования акцента</tspan></text>
