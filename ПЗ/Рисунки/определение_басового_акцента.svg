<polyline points="1536.0,907.0 1510,920 1536.0,933.0" fill="none" stroke="black" stroke-width="4"/>
<text x="1495" y="652" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Да</tspan></text>
<rect x="280" y="850" width="530" height="190" fill="none" stroke="black" stroke-width="4"/>
<text x="545.0" y="916.5" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Возврат 0</tspan></text>
<text x="545.0" y="973.5" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Без нового события</tspan></text>
<rect x="980" y="850" width="530" height="190" fill="none" stroke="black" stroke-width="4"/>
<text x="1245.0" y="888.0" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Интервал 0,14 с</tspan></text>
