<text x="890" y="663.5" font-family="Times New Roman" font-size="46" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Условия акцента</tspan></text>
<text x="890" y="716.5" font-family="Times New Roman" font-size="46" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>выполнены?</tspan></text>
