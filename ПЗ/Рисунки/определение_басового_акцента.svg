<polyline points="254.0,933.0 280,920 254.0,907.0" fill="none" stroke="black" stroke-width="4"/>
<text x="235" y="652" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Нет</tspan></text>
