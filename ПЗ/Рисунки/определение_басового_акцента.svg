<text x="890.0" y="108.5" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Проверка входных условий</tspan></text>
<polyline points="890,145 890,205" fill="none" stroke="black" stroke-width="4"/>
