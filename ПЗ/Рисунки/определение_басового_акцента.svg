<text x="890.0" y="488.5" font-family="Times New Roman" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan>Обновление фона: постоянная 0,65 с</tspan></text>
<polyline points="890,525 890,585" fill="none" stroke="black" stroke-width="4"/>
<polyline points="877.0,559.0 890,585 903.0,559.0" fill="none" stroke="black" stroke-width="4"/>
